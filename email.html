<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontak Yang Mulia</title>
  <style>
    /* Reset dan tata letak tengah */
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Kontainer form */
    .form-container {
      background-color: #1e293b;
      padding: 40px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    /* Judul */
    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 1.8em;
      color: #38bdf8;
    }

    /* Label */
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #cbd5e1;
    }

    /* Input dan Textarea */
    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: #334155;
      color: #f8fafc;
      margin-bottom: 20px;
      font-size: 1em;
    }

    input::placeholder, textarea::placeholder {
      color: #94a3b8;
    }

    /* Tombol Kirim */
    button {
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #0ea5e9;
    }
  </style>
</head>
<body>

  <!-- modify this form HTML and place wherever you want your form -->
<form
action="https://formspree.io/f/xyzwzrep"
method="POST"
>
<label>
  Your email:
  <input type="email" name="email">
</label>
<label>
  Your message:
  <textarea name="message"></textarea>
</label>
<!-- your other form fields go here -->
<button type="submit">Send</button>
</form>

</body>
</html>
